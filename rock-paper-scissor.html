<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Rock Paper Scissor</title>
    <script>
        const score={
            Wins:0,
            Loss:0,
            Ties:0 
        }
      let result = "";
      let move = "";
      function genNum() {
        const genNum = Math.random();
        if (genNum < 1 / 3) {
          move = "Rock";
        } else if (genNum >= 1 / 3 && genNum <= 2 / 3) {
          move = "Paper";
        } else {
          move = "Scissors";
        }
        console.log(move);
        return move;
      }

      function playGame(yourMove) {
        const compMove = genNum();
        if (yourMove == "Rock") {
          if (move == "Rock") {
            result = "Tie.";
          } else if (move == "Paper") {
            result = "You lose.";
          } else {
            result = "You won.";
          }
        } else if (yourMove == "Paper") {
          if (move == "Rock") {
            result = "You won.";
          } else if (move == "Paper") {
            result = "Tie.";
          } else {
            result = "You lose.";
          }
        } else if (yourMove == "Scissors") {
          if (move == "Rock") {
            result = "You lose.";
          } else if (move == "Paper") {
            result = "You won.";
          } else {
            result = "Tie.";
          }
        }
        if(result=='You won.'){
            score.Wins=score.Wins+1;
        }else if(result=='You lose.'){
            score.Loss=score.Loss+1;
        }if(result=='Tie.'){
            score.Ties=score.Ties+1;
        }
        alert(`You: ${yourMove}\nComputer: ${move}\n${result}\nWins:${score.Wins}  Loss:${score.Loss}  Ties:${score.Ties}`);
        console.log(score);
      }
      function reset(){
        score.Loss=0;
        score.Wins=0;
        score.Ties=0;
        alert(`Wins:${score.Wins}  Loss:${score.Loss}  Ties:${score.Ties}`);
        console.log(score)
      }
    </script>
  </head>

  <body>
    <h1>ROCK PAPER AND SCISSORS</h1>
    <!-- <main id="main1"> -->
    <img
      src="https://cdn.pixabay.com/photo/2014/03/25/15/26/rock-paper-scissors-296854_1280.png"
      height="200px"
      onclick="playGame('Rock')"
    />

    <img
      src="https://cdn.pixabay.com/photo/2014/03/25/15/26/rock-paper-scissors-296855_1280.png"
      height="200px"
      onclick="playGame('Paper')"
    />

    <img
      src="https://cdn.pixabay.com/photo/2014/03/25/15/26/rock-paper-scissors-296853_1280.png"
      height="200px"
      onclick="playGame('Scissors')"
    />
    <button onclick="reset()">RESET</button>
  </body>
</html>
